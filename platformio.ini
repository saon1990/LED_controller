; ============================================================
; MAIN LED CONTROLLER
; ============================================================

[env:freenove_esp32_s3_wroom]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = freenove_esp32_s3_wroom
framework = arduino
monitor_speed = 115200

board_build.partitions = rainmaker_8MB.csv

build_src_filter =
    -<REMOTE_RX_TEST.cpp>

lib_deps =
    adafruit/Adafruit NeoPixel
    nRF24/RF24


; ============================================================
; RC03RFB - RX ONLY TEST
; ============================================================

[env:remote_rx_test]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = freenove_esp32_s3_wroom
framework = arduino
monitor_speed = 115200

build_src_filter =
    -<main.cpp>
    -<REMOTE/RemoteManager.cpp>
    +<REMOTE_RX_TEST.cpp>
    +<REMOTE/RemoteProtocol.cpp>
    +<REMOTE/RemoteCommands.cpp>

lib_deps =
    nRF24/RF24